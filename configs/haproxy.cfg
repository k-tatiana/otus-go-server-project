global
    maxconn 256
    log stdout format raw local0 info

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE

frontend postgres_frontend
    bind *:5433
    mode tcp
    
    # Разделение трафика по портам
    default_backend replicas

backend replicas
    mode tcp
    balance leastconn # Использование: Долгие соединения (WebSocket, базы данных, SSH)
    option pgsql-check user postgres
    server pgslave pgslave:5432 check port 5432 weight 50
    server pgasyncslave pgasyncslave:5432 check port 5432 weight 50
