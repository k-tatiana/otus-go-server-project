version: "3.8"

services:
  app: &app-template
    build: .
    container_name: go-server-app
    depends_on:
      db-master:
        condition: service_healthy
      haproxy:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    env_file:
      - envs/.env-balancing
    networks:
      - pgnet

  app-1:
    <<: *app-template
    container_name: go-server-app-1
    ports:
      - "18080:8080"
  
  app-2:
    <<: *app-template
    container_name: go-server-app-2
    ports:
      - "2808:8080"

  app-3:
    <<: *app-template
    container_name: go-server-app-3
    ports:
      - "3808:8080"
  
  nginx:
    image: nginx:1.21
    container_name: nginx-lb
    restart: on-failure
    networks:
      - pgnet
    volumes:
      - "./configs/default.conf:/etc/nginx/conf.d/default.conf"
    ports:
      - "4088:80"
      - "4098:8080"

  db-master:
    image: postgres:16
    container_name: pgmaster
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - "$PWD/volumes/pgmaster/:/var/lib/postgresql/data"
    networks:
      - pgnet

  db-slave-1:
    image: postgres:16
    container_name: pgslave
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    # ports:
    #   - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - "$PWD/volumes/pgslave/:/var/lib/postgresql/data"
    networks:
      - pgnet

  db-slave-2:
    image: postgres:16
    container_name: pgasyncslave
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    # ports:
    #   - "25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - "$PWD/volumes/pgasyncslave/:/var/lib/postgresql/data"
    networks:
      - pgnet

  db-migrate:
    build:
      context: ./scripts
      dockerfile: Dockerfile
    container_name: goose-migrate
    depends_on:
      - db-master
      # - db-slave-1
      # - db-slave-2
    volumes:
      - ./migrations:/migrations
      - ./scripts:/scripts
    working_dir: /scripts
    entrypoint: ["/bin/sh", "wait-and-migrate.sh"]
    networks:
      - pgnet

  haproxy:
    image: haproxy:2.4
    container_name: haproxy-lb
    restart: "no"
    networks:
      - pgnet
    volumes:
      - "./configs/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg"
    ports:
      - "5433:5433"    # Дополнительный порт для чтения PostgreSQL
      - "8404:8404"    # Статистика HAProxy
    depends_on:
      - db-slave-1
      - db-slave-2
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # rabbitmq:
  #   image: "rabbitmq:3-management"
  #   container_name: rabbitmq
  #   ports:
  #     - "5672:5672"
  #     - "15672:15672"
  #   environment:
  #     RABBITMQ_DEFAULT_USER: rmq_user
  #     RABBITMQ_DEFAULT_PASS: rmq_password
  #   volumes:
  #     - "$PWD/volumes/rabbitmq/:/var/lib/rabbitmq"
  #   networks:
  #     - pgnet

  # tarantool:
  #   image: "tarantool/tarantool:3.5.0"
  #   container_name: tarantool
  #   ports:
  #     - "3301:3301"
  #     - "8081:8081"
  #   environment:
  #     TZ: UTC
